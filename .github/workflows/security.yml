name: security

# DELIBERATELY NOT path-filtered. A secret can be committed to any path — a
# policy document, a draft post, a config file — so this must run on every
# change, unlike the site and governance workflows.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret may predate this pull request.
          fetch-depth: 0
      # Not gitleaks/gitleaks-action: from v2 it refuses to run for an
      # organization without a purchased GITLEAKS_LICENSE, and izziwoot is an
      # organization. It failed closed with "missing gitleaks license", so the
      # highest-likelihood control was not running at all. The binary is the
      # same scanner, pinned by version and verified by checksum before it is
      # executed, which is a stronger supply-chain claim than a tag anyway.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # `gitleaks git` scans history; 8.30 removed `detect` and hid `protect`.
      # Matches the pre-commit hook's scanner version exactly, so local and CI
      # cannot disagree about what counts as a secret.
      - name: Scan full history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner

      # The scanner must not be left in the tree for later steps or artifacts.
      - name: Remove the downloaded binary
        if: always()
        run: rm -f gitleaks gitleaks.tar.gz

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The action reads `packageManager` from this file. Without it the
          # action looks at the repository root, where there is no manifest, and
          # fails with "No pnpm version is specified". The pin stays in
          # site/package.json so there is one source of truth (GC-2).
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm audit --audit-level=high
        working-directory: site
