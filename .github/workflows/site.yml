name: site

# Path-filtered: a governance-only change must not deploy or rebuild the site.
on:
  push:
    branches: [main]
    paths: ['site/**', 'lychee.toml', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'lychee.toml', '.github/workflows/site.yml']

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || 'izziwoot/placeholder' }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID || 'R_placeholder' }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID || 'DIC_placeholder' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The action reads `packageManager` from this file. Without it the
          # action looks at the repository root, where there is no manifest, and
          # fails with "No pnpm version is specified". The pin stays in
          # site/package.json so there is one source of truth (GC-2).
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      # Granular rather than a single `pnpm verify`, so a failure names its own
      # step in the UI. The one difference from local: links use the lychee
      # action below instead of a locally installed binary.
      - run: pnpm check
        working-directory: site
      - run: pnpm lint:content
        working-directory: site
      - run: pnpm lint:md
        working-directory: site
      - run: pnpm format:check
        working-directory: site
      - run: pnpm test
        working-directory: site
      - run: pnpm build
        working-directory: site
      - run: pnpm verify:headers
        working-directory: site
      - run: pnpm verify:output
        working-directory: site

      - name: Internal link and anchor check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/site/dist site/dist
          fail: true

      # Not treosh/lighthouse-ci-action: lighthouserc.json resolves
      # `staticDistDir: "dist"` against the working directory, and the action runs
      # from the repository root, where there is no dist/. LHCI served an empty
      # directory, every URL returned 404, and `collect` died before a single
      # budget was evaluated — the gate reported failure without ever measuring.
      # Running the repository's own script from site/ makes the path resolve and
      # means local and CI invoke one identical command, the same reasoning as
      # Task 17's verify chain. @lhci/cli still stays out of the lockfile via dlx
      # (Task 18), and ubuntu-latest ships Chrome for it to drive.
      - name: Lighthouse budgets
        run: pnpm lint:lighthouse
        working-directory: site

      # Diagnostic, not a gate. CLS fails here and cannot be reproduced on a
      # developer machine, where the same build measures 0.0006 — so the report
      # has to say which element moved rather than leaving it to inference.
      - name: Name the layout-shift culprits
        if: failure()
        working-directory: site
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, existsSync } from 'node:fs';
          if (!existsSync('.lighthouseci')) { console.log('no reports'); process.exit(0); }
          for (const f of readdirSync('.lighthouseci').filter((n) => n.startsWith('lhr-') && n.endsWith('.json'))) {
            const d = JSON.parse(readFileSync(`.lighthouseci/${f}`, 'utf8'));
            const cls = d.audits['cumulative-layout-shift']?.numericValue ?? 0;
            if (cls <= 0.02) continue;
            console.log(`\n=== ${d.finalDisplayedUrl} CLS=${cls} ===`);
            for (const id of ['layout-shifts', 'layout-shift-elements', 'cls-culprits-insight']) {
              const a = d.audits[id];
              if (!a) continue;
              console.log(`--- ${id} (score=${a.score}) ---`);
              console.log(JSON.stringify(a.details?.items ?? a.details ?? {}, null, 1).slice(0, 4000));
            }
            break;
          }
          JS
